# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-myowndisto"
BBFILE_PATTERN_meta-myowndisto = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-myowndisto = "6"

LAYERDEPENDS_meta-myowndisto = "core"
LAYERSERIES_COMPAT_meta-myowndisto = "whinlatter"
