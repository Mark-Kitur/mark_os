# Parallel build
BB_NUMBER_THREADS = "8"
BB_NUMBER_PARSE_THREADS = "8"
PARALLEL_MAKE = "-j 8"
PARALLEL_MAKEINST = "-j 8"

# game changer in build times and saving the machine from overheating. This will make the build system wait until the CPU pressure is below the specified value before starting new tasks. 
# The value is a percentage of CPU time spent waiting for resources, so a value of 900000 means that the build system will wait until the CPU pressure is below 90% before starting new tasks.


#but first run this command to determine the approtiate value
# pressure="0"
# while true; do
#    prev_pressure="$pressure"
#    pressure=$(head -1 /proc/pressure/cpu  | cut -d' ' -f5 | cut -d'=' -f2)
#    echo $(( $pressure - $prev_pressure ))
#    sleep 1
# done
# Note

# Change /proc/pressure/cpu to /proc/pressure/io or /proc/pressure/memory to change the pressure type to monitor.


BB_PRESSURE_MAX_CPU = "900000"
# BB_PRESSURE_MAX_IO = "500"
#BB_PRESSURE_MAX_MEMORY = "100000"

# shared cache
SSTATE_DIR  = "${TOPDIR}/../sstate-cache"
DL_DIR = "${TOPDIR}/../downloads"

#PAckaging 
PACKAGE_CLASSES = "package_ipk"
# PACKAGE_EXCLUDE:pn-core-image-sato = "custom-logo hello-c"


# remove intermidiate files
INHERIT += "rm_work"

#other speedup options
INHIBIT_PACKAGE_DEBUG_SPLIT = "1"


#communications 
ENABLE_UART = "1"

#enables ssh
